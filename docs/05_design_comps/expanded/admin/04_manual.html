<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecdd">
<title>手動予約｜予約管理</title>
<!-- Expanded comp S-A-05 手動予約 — 未入力（お名前に「やまだ」と入力して既存顧客サジェストが開いた状態）、「この日の空き」チップ、経路セグメント（FR-A-05、CW-22） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
/* @shared:start */
/* ---- Admin PWA shared CSS (DG-001 + expanded admin comps). Source of truth: tools/expanded_admin_shared.css,
   injected into each page by tools/sync_expanded_admin.py so every page stays self-contained.
   Components reference semantic tokens only. Admin-local aliases below fill token gaps (see README). ---- */
:root{
  --info: var(--status-open);          /* gap: --info (未確認・情報バナー・空き時刻) */
  --on-info: var(--bg-card);
  --inverse: var(--fg);                /* gap: --inverse-surface (トースト) */
  --on-inverse: var(--bg);
  --hatch: var(--border-subtle);       /* gap: --block-hatch */
  --accent-line: rgb(244 236 221 / .4);/* primary の内側の細線（ライト） */
  --scrim: rgb(25 25 25 / .5);         /* gap: --scrim */
  --tabbar-h: 72px;
  --row: 28px;                         /* タイムライン 15 分 = 28px */
  /* カンプだけの安全領域の模擬（本番は env(safe-area-inset-*)） */
  --sim-safe-top: 47px; --sim-safe-bottom: 34px;
  --safe-bottom: max(var(--sim-safe-bottom), env(safe-area-inset-bottom));
}
[data-theme="dark"]{ --accent-line: rgb(25 25 25 / .35); --scrim: rgb(0 0 0 / .6); }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);font-family:var(--font-sans);font-size:var(--text-16);line-height:var(--leading-body);letter-spacing:var(--tracking-body);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul,dl,dd,figure,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0}
li{list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sbi{height:12px;width:auto;fill:currentColor;stroke:none}
.vh,.vh-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;padding:0;border:0}
.caps{font:700 var(--text-12)/var(--text-12--lh) var(--font-lato);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.cap{font-size:var(--text-12);line-height:var(--text-12--lh);color:var(--fg-muted)}
.muted{color:var(--fg-muted)}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 var(--gutter)}

/* ---- device chrome (模擬: standalone の状態バーとホームインジケーター) ---- */
.sb{display:flex;align-items:center;justify-content:space-between;height:var(--sim-safe-top);padding:6px 26px 0 34px;font:700 15px/1 var(--font-lato);letter-spacing:0}
.sb-i{display:flex;align-items:center;gap:6px}
.hi{position:fixed;left:50%;bottom:8px;z-index:90;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);pointer-events:none}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-4);border-radius:var(--radius-sm);font:700 var(--text-16)/1.25 var(--font-sans);letter-spacing:.04em;text-decoration:none;text-align:center;cursor:pointer;transition:background-color var(--duration-short2) var(--ease-standard),transform var(--duration-short2) var(--ease-standard)}
.btn:active{transform:translateY(1px)}
.btn-block{display:flex;width:100%}
.btn-primary{min-height:var(--target-cta);background:var(--accent);color:var(--on-accent);letter-spacing:.06em;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px var(--accent-line)}
.btn-primary:hover{background:var(--accent-pressed);box-shadow:inset 0 0 0 3px var(--accent-pressed),inset 0 0 0 4px var(--accent-line)}
.btn-secondary{background:var(--bg-card);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-sunken)}
.btn-sm{min-height:var(--target-min);padding:0 var(--space-3);font-size:var(--text-14)}
.btn-sm .ic{width:16px;height:16px}
.btn-primary.btn-sm{min-height:var(--target-min);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3px var(--accent-line)}
.btn-ghost{min-height:var(--target-min);padding:0 var(--space-2);font-size:var(--text-14);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn[aria-disabled="true"].is-off,.is-off{background:transparent;border:1px dashed var(--fg-subtle);color:var(--fg-subtle);box-shadow:none;cursor:default}
.icon-btn{display:grid;place-items:center;flex:none;width:var(--target-min);height:var(--target-min);border-radius:var(--radius-sm);text-decoration:none;color:var(--fg)}
.icon-btn.boxed{background:var(--bg-card);border:1px solid var(--border)}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

/* ---- app header ---- */
.ah{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:var(--space-1);min-height:56px;padding:0 var(--space-2);border-bottom:1px solid var(--border)}
.ah h1{flex:1;min-width:0;font-size:var(--text-16);line-height:1.25;font-weight:700;letter-spacing:.08em}
.ah .end{margin-left:auto;margin-right:var(--space-2)}

/* ---- chips (状態) / pills (経路) ---- */
.chip{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 var(--space-2);border:1px solid var(--border);border-radius:var(--radius-full);font:700 var(--text-12)/16px var(--font-sans);letter-spacing:.04em;white-space:nowrap;color:var(--fg);background:var(--bg-card)}
.chip .ic{width:12px;height:12px;stroke-width:2.5}
.chip-fill{background:var(--fg);border-color:var(--fg);color:var(--bg-card)}
.chip-info{border-color:var(--info);color:var(--info)}
.chip-muted{border-color:var(--fg-subtle);color:var(--fg-muted)}
.chip-cancel{border-style:dashed;border-color:var(--fg-subtle);color:var(--fg-muted)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:var(--radius-sm);background:var(--bg-sunken);color:var(--fg);font:700 var(--text-12)/16px var(--font-sans);letter-spacing:.02em;white-space:nowrap}

/* ---- tab bar (72px + safe area) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-card);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom)}
.tabbar ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--tabbar-h);max-width:640px;margin:0 auto;padding:var(--space-2) var(--space-1)}
.tab{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;height:56px;border-radius:var(--radius-sm);font-size:var(--text-12);line-height:16px;font-weight:700;letter-spacing:.04em;color:var(--fg-muted);text-decoration:none}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-9px;left:25%;right:25%;height:3px;background:var(--fg);border-radius:0 0 2px 2px}
.tbadge{position:absolute;top:2px;left:calc(50% + 6px);display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-full);background:var(--info);color:var(--on-info);font:700 var(--text-12)/1 var(--font-num);letter-spacing:0}
.has-tabbar{padding-bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + var(--space-6))}
.has-fab{padding-bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + 56px + var(--space-8))}

/* ---- FAB（拡張 FAB「＋ 追加」56px、CW-20） ---- */
.fab{position:fixed;right:var(--gutter);bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + var(--space-4));z-index:21;display:inline-flex;align-items:center;gap:var(--space-2);height:56px;padding:0 var(--space-6) 0 var(--space-4);border-radius:var(--radius-lg);background:var(--accent);color:var(--on-accent);font:700 var(--text-16)/1 var(--font-sans);letter-spacing:.06em;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px var(--accent-line),var(--shadow-2)}
.fab .ic{width:24px;height:24px;stroke-width:2.25}
/* トースト表示中は FAB をトーストの上へ逃がす（M3 の snackbar と同じ） */
.fab.lifted{bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + var(--space-3) + 88px)}
.fab.is-off{background:var(--bg);border:1px dashed var(--fg-subtle);color:var(--fg-subtle);box-shadow:none}

/* ---- forms ---- */
.field{display:grid;gap:6px;min-width:0}
.label{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 var(--space-2);font-size:var(--text-14);line-height:var(--text-14--lh);font-weight:700}
.req{font-size:var(--text-12);line-height:16px;font-weight:500;color:var(--fg-muted)}
.help{font-size:var(--text-14);line-height:1.6;color:var(--fg-muted)}
.input{display:block;width:100%;min-width:0;height:48px;padding:0 var(--space-3);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--fg);font-size:var(--text-16);line-height:1.5}
.input::placeholder{color:var(--fg-muted);opacity:1}
textarea.input{height:auto;min-height:88px;padding:var(--space-3);resize:vertical}
.input[aria-invalid="true"],.input.is-changed{border-width:2px;padding:0 calc(var(--space-3) - 1px)}
.select{position:relative;display:block;min-width:0}
.select select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer}
.select .ic{position:absolute;right:10px;top:50%;width:18px;height:18px;margin-top:-9px;pointer-events:none;color:var(--fg)}
.select select.is-empty{color:var(--fg-muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3)}
.prefix{position:relative;display:block}
.prefix>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:400 var(--text-16)/1 var(--font-num);color:var(--fg-muted);pointer-events:none}
.prefix .input{padding-left:28px}

/* segmented control（ラジオ。選択中 = インクの塗り） */
.seg-row{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.seg-row label{position:relative;flex:1 1 auto;display:block;min-width:0}
.seg-row label>span{display:flex;align-items:center;justify-content:center;gap:4px;min-height:var(--target-min);padding:0 var(--space-3);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);font-size:var(--text-14);line-height:1.2;font-weight:700;white-space:nowrap;cursor:pointer}
.seg-row input:checked+span{background:var(--fg);border-color:var(--fg);color:var(--bg-card)}
.seg-row input:checked+span::before{content:"✓";font-size:12px}
.seg-row input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}

/* switch（52×32、タップ領域 44px 以上） */
.sw{position:relative;display:inline-grid;place-items:center;flex:none;min-width:56px;min-height:var(--target-min);cursor:pointer}
.sw .track{position:relative;width:52px;height:32px;border-radius:var(--radius-full);background:var(--bg-sunken);border:1px solid var(--fg-subtle);transition:background-color var(--duration-short3) var(--ease-standard)}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg-subtle);transition:transform var(--duration-short3) var(--ease-standard)}
.sw input:checked+.track{background:var(--fg);border-color:var(--fg)}
.sw input:checked+.track::after{transform:translateX(20px);background:var(--bg-card)}
.sw input:focus-visible+.track{outline:2px solid var(--ring);outline-offset:2px}

/* 空き時刻チップ（◎ と同じ青枠。タップで開始に入る） */
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.time-chip{display:inline-flex;align-items:center;justify-content:center;min-width:72px;min-height:var(--target-min);padding:0 10px;border:1px solid var(--status-open);border-radius:var(--radius-sm);background:var(--bg-card);font:700 var(--text-16)/1 var(--font-num);letter-spacing:.02em;color:var(--fg)}
.time-chip::before{content:"◎";margin-right:4px;font:700 var(--text-14)/1 var(--font-sans);color:var(--status-open)}

/* ---- cards, lists, sections ---- */
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-1)}
.sunken{background:var(--bg-sunken);border-radius:var(--radius-sm)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);margin:var(--space-8) 0 var(--space-3);font-size:var(--text-16);line-height:1.4;font-weight:700;letter-spacing:.04em;font-feature-settings:"palt"}
.sec-h.first{margin-top:var(--space-4)}
.list{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-1)}
.list>li+li{border-top:1px solid var(--border-subtle)}
.row-link{display:flex;align-items:center;gap:var(--space-3);min-height:56px;padding:var(--space-2) var(--space-3) var(--space-2) var(--space-4);text-decoration:none}
.row-link .grow{flex:1;min-width:0}
.row-link>.ic:last-child{color:var(--fg-muted)}

/* banners: info = 青の左罫＋i、warn = 太枠＋「!」（えんじは使わない） */
.banner{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4) var(--space-3) var(--space-3);background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-size:var(--text-14);line-height:1.6}
.banner>.ic{margin-top:1px}
.banner b{display:block;font-size:var(--text-16);line-height:1.5}
.banner.info{box-shadow:inset 4px 0 0 var(--info)}
.banner.info>.ic{color:var(--info)}
.banner.warn,.alert{border:2px solid var(--fg);box-shadow:inset 4px 0 0 var(--fg)}
.alert{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-4) calc(var(--space-4) + 4px);background:var(--bg-card);border-radius:var(--radius-sm)}
.alert-ttl{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-16);line-height:1.5;font-weight:700}

/* ---- toast（role="status"、反転面） ---- */
.toast{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(var(--sim-safe-bottom) + var(--space-4));z-index:60;display:flex;align-items:center;gap:var(--space-2);min-height:56px;max-width:608px;margin:0 auto;padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--inverse);color:var(--on-inverse);box-shadow:var(--shadow-2);font-size:var(--text-14);line-height:1.45;font-weight:700}
.toast .msg{flex:1;min-width:0}
.toast .msg small{display:block;font-size:var(--text-12);line-height:16px;font-weight:500}
.toast .ic{color:var(--on-inverse)}
.toast.above-tabs{bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + var(--space-3))}
.toast.top{top:calc(var(--sim-safe-top) + var(--space-2));bottom:auto}
.undo{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:var(--target-min);padding:0 10px;border:1px solid var(--on-inverse);border-radius:var(--radius-sm);color:var(--on-inverse);background:var(--inverse);font:700 var(--text-14)/1 var(--font-sans);letter-spacing:.04em}
.count{position:relative;display:grid;place-items:center;width:24px;height:24px;font:700 var(--text-12)/1 var(--font-num)}
.count svg{position:absolute;inset:0;width:24px;height:24px;transform:rotate(-90deg);fill:none;stroke:currentColor;stroke-width:2}

/* ---- bottom sheet ---- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100vh - var(--sim-safe-top) - var(--space-2));overflow:auto;max-width:640px;margin:0 auto;padding:var(--space-2) var(--gutter) calc(var(--safe-bottom) + var(--space-4));background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-2)}
.grip{width:36px;height:4px;margin:0 auto var(--space-2);border-radius:2px;background:var(--fg-subtle)}
.sheet-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.sheet-head h2{flex:1;font-size:var(--text-20);line-height:var(--text-20--lh);font-weight:700;font-feature-settings:"palt"}

/* ---- fixed CTA bar ---- */
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:var(--space-3) var(--gutter) calc(var(--safe-bottom) + var(--space-2));background:var(--bg-card);border-top:1px solid var(--border)}
.cta-bar>*{max-width:608px;margin-left:auto;margin-right:auto}
.cta-bar .cap{margin-bottom:var(--space-2);text-align:center}
.cta-bar.above-tabs{bottom:calc(var(--tabbar-h) + var(--sim-safe-bottom) + 1px);padding-bottom:var(--space-3);border-bottom:0}
.has-cta{padding-bottom:calc(56px + var(--sim-safe-bottom) + var(--space-12))}

/* ---- settings segment nav ---- */
.segnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-1);margin:var(--space-3) 0 0;padding:3px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card)}
.segnav a{display:grid;place-items:center;min-height:var(--target-min);border-radius:2px;font-size:var(--text-14);font-weight:700;text-decoration:none;color:var(--fg-muted)}
.segnav a[aria-current="page"]{background:var(--fg);color:var(--bg-card)}

/* ---- timeline (S-A-02) ---- */
.dayhead h1{display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:var(--text-20);line-height:var(--text-20--lh);letter-spacing:.02em;font-feature-settings:"palt";white-space:nowrap}
.dayhead h1 .num{font-size:1.1em}
.inbox-btn{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:var(--target-min);padding:0 var(--space-2) 0 var(--space-3);margin-left:var(--space-1);border:1px solid var(--info);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--info);font-size:var(--text-14);font-weight:700;text-decoration:none;white-space:nowrap}
.inbox-btn b{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-full);background:var(--info);color:var(--on-info);font:700 var(--text-14)/1 var(--font-num)}
.inbox-btn.is-off{border-style:dashed;border-color:var(--fg-subtle);color:var(--fg-subtle);background:transparent}
.daysum{display:flex;flex-wrap:wrap;gap:0 var(--space-3);padding:var(--space-2) var(--gutter);border-bottom:1px solid var(--border-subtle);font-size:var(--text-14);line-height:var(--text-14--lh);color:var(--fg-muted)}
.daysum b{font:700 var(--text-14)/1 var(--font-num);color:var(--fg)}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr);padding:var(--space-4) var(--gutter) 0 0}
.tl-hours{position:relative;height:calc(24 * var(--row))}
.tl-hours span{position:absolute;right:8px;transform:translateY(-50%);font:400 var(--text-12)/16px var(--font-num);color:var(--fg-muted);letter-spacing:0}
.tl-hours span.h{font-weight:700;color:var(--fg)}
.lane{position:relative;height:calc(24 * var(--row));border-left:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);background:linear-gradient(to bottom,var(--border-subtle) 0 1px,transparent 1px) 0 0/100% calc(4 * var(--row)) repeat-y}
.lane::before,.lane::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to right,var(--border-subtle) 0 4px,transparent 4px 8px)}
.lane::before{-webkit-mask:repeating-linear-gradient(to bottom,transparent 0 calc(2 * var(--row)),#000 calc(2 * var(--row)) calc(2 * var(--row) + 1px),transparent calc(2 * var(--row) + 1px) calc(4 * var(--row)));mask:repeating-linear-gradient(to bottom,transparent 0 calc(2 * var(--row)),#000 calc(2 * var(--row)) calc(2 * var(--row) + 1px),transparent calc(2 * var(--row) + 1px) calc(4 * var(--row)))}

.bk{z-index:2;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-1)}

.blk{z-index:2;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border:1px dashed var(--fg-subtle);border-radius:var(--radius-sm);background:repeating-linear-gradient(-45deg,var(--hatch) 0 2px,transparent 2px 9px);text-decoration:none}

.now{position:absolute;left:-5px;right:0;top:calc(var(--m) * var(--row) / 15 - 1px);height:2px;background:var(--accent);z-index:4;pointer-events:none}

.form{display:grid;gap:var(--space-4);padding-top:var(--space-4)}

.input.is-focus{border-width:2px;padding:0 calc(var(--space-3) - 1px);outline:2px solid var(--ring);outline-offset:2px}

.end-note{margin-top:calc(var(--space-3) * -1)}
.free-cap{display:block;margin-bottom:var(--space-2);font-size:var(--text-14);line-height:var(--text-14--lh);font-weight:700}
