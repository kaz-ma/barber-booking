<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お客様情報（3/4）｜ご予約｜Neuer Barber 長田</title>
<!-- Expanded comp S-C-02b 予約 ③ お客様情報 /ja/book/info — 全段を入力済み（氏名・ふりがな → 学生 → 電話）、ご要望は閉じた状態 — DG-001 v0.3 / WF-C v0.4 customer_04_book_info 2026-10-12 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
/* ---- page-local token（DG-001 §9.1: --danger は tokens.css に未定義。えんじ（色相 0°）と別の朱 19°、紙の最暗部で 5.22:1） ---- */
:root{--danger:#a33b0b;--danger-pressed:#862f08}
/* ---- base（base/*.html と同じ） ---- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:160px}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-16);line-height:var(--leading-body);letter-spacing:var(--tracking-body);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd,ol,ul,figure,address,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0}
[hidden]{display:none!important}
li{list-style:none}
address{font-style:normal}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
.caps{font:700 var(--text-12)/var(--text-12--lh) var(--font-lato);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nw{display:inline-block;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 var(--gutter)}
/* ---- buttons（§5.1） ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-6);border:0;border-radius:var(--radius-sm);font:700 var(--text-16)/1.25 var(--font-sans);letter-spacing:.06em;text-decoration:none;text-align:center;cursor:pointer;transition:background-color var(--duration-short2) var(--ease-standard),transform var(--duration-short2) var(--ease-standard)}
.btn:active{transform:translateY(1px)}
.btn-primary{width:100%;min-height:var(--target-cta);background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgb(244 236 221 / .4)}
.btn-primary:hover{background:var(--accent-pressed);box-shadow:inset 0 0 0 3px var(--accent-pressed),inset 0 0 0 4px rgb(244 236 221 / .4)}
/* 無効（aria-disabled）: 色を薄くせず「破線 = できない」の言語（§5.1 icon の無効と同じ）。押せる（押すとエラー文） */
.btn-primary[aria-disabled="true"]{background:transparent;color:var(--fg-subtle);box-shadow:none;border:1px dashed var(--fg-subtle);cursor:not-allowed}
.btn-primary[aria-disabled="true"]:active{transform:none}
.btn-secondary{width:100%;background:var(--bg-card);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-sunken)}
.btn-sm{width:auto;min-height:var(--target-min);padding:0 var(--space-4);font-size:var(--text-14);letter-spacing:.04em}
.btn-ghost{display:inline-flex;width:auto;min-height:var(--target-min);padding:0 var(--space-2);background:none;font-size:var(--text-14);letter-spacing:.04em;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn-ghost:hover{text-decoration-thickness:2px}
/* 破壊的操作（S-C-06）: 枠線 2px の --danger。塗りは確認シートの「予約を取り消す」だけ */
.btn-danger{width:100%;background:var(--bg-card);color:var(--danger);border:2px solid var(--danger)}
.btn-danger:hover{background:var(--bg-sunken)}
.btn-danger-fill{width:100%;background:var(--danger);color:var(--on-accent)}
.btn-danger-fill:hover{background:var(--danger-pressed)}
.two{display:grid;text-align:left;line-height:1.25}
.two small{font:400 var(--text-12)/16px var(--font-num);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
/* ---- flow header（§5.3 予約フロー） ---- */
.flow-head{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.flow-head .in{display:flex;align-items:center;gap:var(--space-1);height:56px;max-width:640px;margin:0 auto;padding:0 var(--space-2)}
.flow-head h1{flex:1;font-size:var(--text-16);line-height:1;font-weight:700;letter-spacing:.08em}
.back{display:grid;place-items:center;width:var(--target-min);height:var(--target-min);border-radius:var(--radius-sm)}
.lang{display:grid;place-items:center;min-width:var(--target-min);height:var(--target-min);padding:0 var(--space-1);font:700 var(--text-14)/1 var(--font-lato);letter-spacing:.08em;text-decoration:none}
.lang[lang="ja"]{font-family:var(--font-sans);letter-spacing:.02em}
.flow-head .btn-sm{padding:0 var(--space-3)}
.flow-head .btn-sm .ic{width:18px;height:18px}
/* ---- site header（トップ・ポリシー・404） ---- */
.site-head{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.site-head .in{display:flex;align-items:center;gap:var(--space-2);height:64px;max-width:640px;margin:0 auto;padding:0 var(--gutter)}
.brand{display:flex;align-items:center;gap:var(--space-2);min-height:var(--target-min);margin-right:auto;text-decoration:none}
.brand img{height:48px;width:auto;filter:brightness(.32)}
.wm{display:grid}
.wm b{font:700 13px/16px var(--font-lato);letter-spacing:.2em}
.wm small{font-size:var(--text-12);line-height:16px;color:var(--fg-muted);letter-spacing:.08em}
.site-head .btn-primary{width:auto;min-height:var(--target-min);padding:0 var(--space-4);font-size:var(--text-14)}
/* mini header（完了・キャンセル: エンブレム 40px＋ワードマーク、EN だけ） */
.mini-head{border-bottom:1px solid var(--border)}
.mini-head .in{display:flex;align-items:center;gap:var(--space-2);height:56px;max-width:640px;margin:0 auto;padding:0 var(--gutter)}
.mini-head .brand img{height:40px}
@media (max-width:359px){.wm{display:none}}
/* ---- stepper（§5.4） ---- */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);padding:var(--space-4) 0 var(--space-2)}
.stepper li{position:relative;display:grid;justify-items:center;align-content:start;gap:var(--space-1);text-align:center;font-size:var(--text-12);line-height:16px;color:var(--fg-muted)}
.stepper li+li::before{content:"";position:absolute;top:11px;right:calc(50% + 16px);width:calc(100% - 32px);border-top:1px solid var(--fg-subtle)}
.stepper li.done+li::before{border-top-color:var(--fg)}
.dot{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--fg-subtle);font:700 var(--text-12)/1 var(--font-lato);color:var(--fg-subtle);background:var(--bg-card)}
.done .dot{border-color:var(--fg);color:var(--fg)}
.done .dot .ic{width:14px;height:14px;stroke-width:2.5}
.cur .dot{background:var(--fg);border-color:var(--fg);color:var(--bg-card)}
.cur{color:var(--fg)!important;font-weight:700}
/* ---- page heading ---- */
.page-h{margin-top:var(--space-6);font-size:var(--text-20);line-height:var(--text-20--lh);font-weight:700;letter-spacing:.04em;font-feature-settings:"palt"}
.page-h:focus{outline:none}
.lead{margin-top:var(--space-1);font-size:var(--text-14);line-height:1.6;color:var(--fg-muted)}
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-1)}
.tag{display:inline-block;margin-left:var(--space-2);padding:0 var(--space-2);border:1px solid var(--fg-muted);border-radius:var(--radius-full);font:700 var(--text-12)/18px var(--font-sans);letter-spacing:.04em;color:var(--fg-muted);white-space:nowrap;vertical-align:2px}
.req{display:inline-block;padding:0 6px;border:1px solid var(--fg-muted);border-radius:2px;font:700 11px/16px var(--font-sans);letter-spacing:.04em;color:var(--fg-muted);white-space:nowrap}
.req.opt{border-style:dashed}
/* ---- sticky CTA bar（safe-area 対応） ---- */
.sticky{position:sticky;bottom:0;z-index:4;margin-top:var(--space-8);border-top:1px solid var(--border);box-shadow:0 -6px 16px rgb(60 40 20 / .10);padding:var(--space-3) 0 max(var(--space-4),env(safe-area-inset-bottom))}
.sticky .in{display:grid;gap:var(--space-2);max-width:640px;margin:0 auto;padding:0 var(--gutter)}
.sticky .sum{display:flex;flex-wrap:wrap;gap:0 var(--space-2);font-size:var(--text-14);line-height:var(--text-14--lh)}
.sticky .sum b{font-weight:700}
.sticky .sum span{white-space:nowrap}
.sticky .hint{font-size:var(--text-12);line-height:16px;color:var(--fg-muted);text-align:center}
/* ---- footer（§5.3） ---- */
.site-foot{margin-top:var(--space-16);background:var(--bg-sunken);border-top:1px solid var(--border);box-shadow:inset 0 3px 0 var(--bg-sunken),inset 0 4px 0 var(--border);padding:var(--space-8) 0 var(--space-6)}
.site-foot nav{display:grid;margin:var(--space-4) 0}
.site-foot nav a{display:flex;align-items:center;justify-content:space-between;min-height:var(--target-min);font-size:var(--text-14);text-decoration:none;border-bottom:1px solid var(--border-subtle)}
.site-foot nav a .ic{width:16px;height:16px;color:var(--fg-muted)}
.site-foot small{display:block;font-size:var(--text-12);line-height:16px;color:var(--fg-muted);letter-spacing:.08em}
@media (min-width:768px){:root{--gutter:var(--space-6)}}

/* ---- SelectionSummary（メニュー・日時の要約と「変更」） ---- */
.recap{margin-top:var(--space-4);padding:0 var(--space-1) 0 var(--space-3)}
.recap .r{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:48px}
.recap .r+.r{border-top:1px solid var(--border-subtle)}
.recap p{flex:1;min-width:0;font-size:var(--text-16);line-height:1.5}
.recap p span{display:inline-block}
.recap .btn-ghost{flex:none}
.recap .tag{margin-left:var(--space-1);vertical-align:1px}
.jst{margin-top:var(--space-2);font-size:var(--text-12);line-height:16px;color:var(--fg-muted)}
/* ---- form sections（段階開示: 開いた段はそのまま残す。完了段は見出しに ✓） ---- */
.fsec{margin-top:var(--space-8)}
.fsec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding-bottom:var(--space-2);border-bottom:1px solid var(--border);box-shadow:0 2px 0 var(--bg),0 3px 0 var(--border-subtle);font-size:var(--text-18);line-height:var(--text-18--lh);font-weight:700;font-feature-settings:"palt"}
.fsec-h>span:first-child{display:flex;align-items:center;gap:var(--space-2)}
.fsec-h .ok{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--fg)}
.fsec-h .ok .ic{width:14px;height:14px;stroke-width:2.5}
.fsec-h .no{font:700 var(--text-12)/16px var(--font-lato);letter-spacing:.08em;color:var(--fg-muted)}
.field{display:grid;gap:var(--space-1);margin-top:var(--space-4)}
.field>label,.field .lbl{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-14);line-height:var(--text-14--lh);font-weight:700}
.input{display:block;width:100%;height:48px;padding:0 var(--space-3);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-16);line-height:1.5}
.input::placeholder{color:var(--fg-muted);opacity:1}
textarea.input{height:auto;min-height:120px;padding:var(--space-3);line-height:var(--leading-body);resize:vertical}
/* aria-invalid: 2px の --fg 枠（赤に頼らない、§9.1）＋直下の「!」付きの文 */
.input[aria-invalid="true"]{border:2px solid var(--fg);padding:0 11px}
.help{font-size:var(--text-14);line-height:1.6;color:var(--fg-muted)}
.err{display:flex;align-items:flex-start;gap:6px;font-size:var(--text-14);line-height:var(--text-14--lh);font-weight:700;color:var(--fg)}
.err .ic{width:18px;height:18px;margin-top:1px}
.count{justify-self:end;font:400 var(--text-12)/16px var(--font-num);color:var(--fg-muted)}
/* 職業ラジオ（縦並び 48px）。選択はチャコールの点＋2px 枠＋太字（えんじは使わない: CTA・選択中の日・時間枠・メニューだけ） */
.radios{display:grid;gap:var(--space-2);margin-top:var(--space-4)}
.radio{position:relative;display:flex;align-items:center;gap:var(--space-3);min-height:48px;padding:0 var(--space-4);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-weight:500;cursor:pointer}
.radio:hover{background:var(--bg-sunken)}
.radio input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.radio:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.radio .rdot{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg-card)}
.radio .rdot::after{content:"";width:10px;height:10px;border-radius:50%}
.radio:has(input:checked){border:2px solid var(--fg);padding:0 15px;font-weight:700}
.radio:has(input:checked) .rdot::after{background:var(--fg)}
.occ-help{margin-top:var(--space-2)}
.add{margin-top:var(--space-3);margin-left:calc(var(--space-2) * -1);gap:var(--space-1);text-decoration:none}
.add .ic{width:18px;height:18px}
.add span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
</style>
</head>
<body class="paper">
<header class="flow-head paper">
  <div class="in">
    <a class="back" href="/ja/book/time?menu=cut&amp;date=2026-10-13" aria-label="日時選択に戻る"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>ご予約</h1>
    <a class="lang" href="/en/book/info?step=phone" hreflang="en" lang="en" aria-label="English">EN</a>
    <a class="btn btn-secondary btn-sm" href="https://ig.me/m/neuer.kento" rel="noopener noreferrer" aria-label="Instagram の DM で問い合わせる（@neuer.kento）"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>Instagram</a>
  </div>
</header>

<main class="wrap">
  <ol class="stepper" aria-label="予約の手順">
    <li class="done"><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>メニューを選ぶ<span class="vh">（完了）</span></li>
    <li class="done"><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>日時を選ぶ<span class="vh">（完了）</span></li>
    <li class="cur" aria-current="step"><span class="dot">3</span>お客様情報</li>
    <li><span class="dot">4</span>確認</li>
  </ol>

  <section class="card recap" aria-label="選んだ内容">
    <div class="r"><p><b>カット</b>（<span class="num">60</span>分）<span>・学生 <span class="num">¥—</span></span></p><a class="btn btn-ghost" href="/ja/book?menu=cut" aria-label="メニューを変更">変更</a></div>
    <div class="r"><p><span><span class="num">10</span>月<span class="num">13</span>日（火）</span> <span class="num">19:00–20:00</span></p><a class="btn btn-ghost" href="/ja/book/time?menu=cut&amp;date=2026-10-13" aria-label="日時を変更">変更</a></div>
  </section>

  <h2 class="page-h" id="info-h" tabindex="-1">お客様情報</h2>
  <p class="lead">ご予約の管理と、当日のご連絡にだけ使います。</p>

  <form id="info" action="/ja/book/confirm" novalidate>
    <section class="fsec" aria-labelledby="s1">
      <h3 class="fsec-h" id="s1"><span><span class="ok" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>お名前・ふりがな<span class="vh">（入力済み）</span></span><span class="no num" aria-hidden="true">1/3</span></h3>
      <div class="field"><label for="name">お名前<span class="req">必須</span></label>
        <input class="input" id="name" name="name" autocomplete="name" value="山田 太郎"></div>
      <div class="field"><label for="kana">ふりがな<span class="req">必須</span></label>
        <input class="input" id="kana" name="full-name-phonetic" value="やまだ たろう" aria-describedby="kana-help">
        <p class="help" id="kana-help">カタカナで入力しても、ひらがなに直して受け付けます</p></div>
    </section>

    <section class="fsec" aria-labelledby="s2">
      <h3 class="fsec-h" id="s2"><span><span class="ok" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>ご職業<span class="vh">（入力済み）</span></span><span class="no num" aria-hidden="true">2/3</span></h3>
      <fieldset class="radios" aria-labelledby="s2" aria-describedby="occ-help">
        <label class="radio"><input type="radio" name="occupation" value="student" checked><span class="rdot" aria-hidden="true"></span>学生</label>
        <label class="radio"><input type="radio" name="occupation" value="worker"><span class="rdot" aria-hidden="true"></span>社会人</label>
      </fieldset>
      <p class="help occ-help" id="occ-help">学生料金の判定に使用します</p>
    </section>

    <section class="fsec" aria-labelledby="s3">
      <h3 class="fsec-h" id="s3"><span><span class="ok" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>電話番号<span class="vh">（入力済み）</span></span><span class="no num" aria-hidden="true">3/3</span></h3>
      <div class="field"><label for="tel">電話番号<span class="req">必須</span></label>
        <p class="help" id="tel-help">当日の連絡にのみ使います。例: 09012345678</p>
        <input class="input" id="tel" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="090-1234-5678" aria-describedby="tel-help"></div>
      <button class="btn btn-ghost add" type="button" aria-expanded="false" aria-controls="note-f"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>ご要望を追加（任意）</span></button>
      <div class="field" id="note-f" hidden><label for="note">ご要望・ご相談</label><textarea class="input" id="note" name="note"></textarea></div>
    </section>
  </form>
</main>

<div class="sticky paper">
  <div class="in">
    <button class="btn btn-primary" type="submit" form="info">確認へ進む<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
<p class="vh" aria-live="polite">ステップ 3/4: お客様情報</p>
</body>
</html>
