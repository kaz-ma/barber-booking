name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Official image ships contrib extensions (btree_gist, pg_trgm). Pinned by digest
      # (multi-arch index of postgres:16, resolved 2026-10-12 from registry-1.docker.io); Renovate bumps it.
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Tests truncate barber_test; the build reads cached menus/settings from barber_build.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barber_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barber_build
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit, component and DB integration tests
        run: npm test
      - name: Prepare build database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE barber_build'
          npm run db:migrate
          npm run db:seed
      - run: npm run build
      # Customer E2E against a production server (`next start`, NODE_ENV=production): the script
      # creates its own database on the service, builds with active menus, runs with throwaway
      # secrets and a local Turnstile siteverify stub (test/e2e/run.mjs).
      - name: Install Playwright (Chromium) for E2E
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Customer E2E
        env:
          E2E_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SITE_URL: http://localhost:3100
        run: node test/e2e/run.mjs --shots test-results/e2e
      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: test-results/e2e
          retention-days: 7
